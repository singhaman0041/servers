<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyStream</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-5">
  <div class="w-full max-w-5xl">
    <div class="flex items-center gap-3 mb-5">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-violet-600 to-blue-600 grid place-items-center">▶</div>
      <div>
        <h1 class="font-bold text-xl">StudyStream</h1>
        <p class="text-slate-400 text-sm">Live room</p>
      </div>
      <span id="state" class="ml-auto px-3 py-1 rounded-full bg-slate-800 text-xs text-slate-300">CONNECTING</span>
    </div>
    <div class="rounded-2xl overflow-hidden bg-black border border-slate-800 shadow-2xl">
      <video id="video" autoplay playsinline muted controls class="w-full aspect-video object-contain bg-black"></video>
    </div>
    <p id="msg" class="text-center text-slate-400 mt-4">Connecting to host…</p>
  </div>
  <script src="/viewer.js"></script>
</body>
</html>
